<nav class="wx-req-steps" aria-label="Requisition steps">{% for step in wizard_steps %}<a class="wx-req-step {% if step.current %}is-current{% endif %} {% if step.complete %}is-complete{% endif %}" href="{{ step.url }}" {% if step.current %}aria-current="step"{% endif %}><span class="wx-req-number">{% if step.complete %}✓{% else %}{{ step.number }}{% endif %}</span><span><small>STEP {{ step.number }}{% if step.complete %} · COMPLETE{% endif %}</small><strong>{{ step.label }}</strong><span>{{ step.owner }}</span>{% if step.count != None %}<b>{{ step.count }} request{{ step.count|pluralize }}</b>{% endif %}</span><span class="wx-req-arrow" aria-hidden="true">→</span></a>{% endfor %}</nav>
