<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV for {{ candidate.name }}</title><style>body{margin:0;background:#e9eeeb;font:15px/1.5 system-ui;color:#18372f}header{position:sticky;top:0;background:#fff;padding:12px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #ccd6ce}a{color:#28594e}img{display:block;max-width:100%;height:auto;margin:12px auto;background:#fff}p{padding:16px}a:focus-visible{outline:3px solid #aa7b31}</style></head><body><header><strong>CV · {{ candidate.name }}</strong>{% if previous %}<a href="?page={{ previous }}">← Previous</a>{% endif %}{% if pages %}<span>Page {{ page }} of {{ pages }}</span>{% endif %}{% if next %}<a href="?page={{ next }}">Next →</a>{% endif %}<a target="_blank" rel="noopener" href="{% if applicant %}{% url 'applicant-cv' candidate.pk %}{% else %}{% url 'workspace-cv' candidate.pk %}{% endif %}">Open original PDF</a></header>{% if error %}<p>{{ error }}</p>{% else %}<img alt="CV page {{ page }} for {{ candidate.name }}" src="{% if applicant %}{% url 'applicant-document-page' candidate.pk page %}{% else %}{% url 'workspace-document-page' candidate.pk page %}{% endif %}">{% endif %}</body></html>
